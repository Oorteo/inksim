repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

      - id: mypy
        name: mypy type check
        entry: uv run mypy src/inksim
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
