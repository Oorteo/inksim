name: AI co-maintainer review

# This workflow is intentionally disabled by default.  It requires:
#   - a repository secret OPENAI_API_KEY
#   - write permissions for pull requests and contents (for auto-merge)
#   - explicit trust in the AI review provider
# Run it manually from the Actions tab once those prerequisites are met.
on:
  workflow_dispatch:

jobs:
  ai-review:
    name: AI review and risk classification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Classify PR risk
        id: classify
        run: |
          uv run python .github/scripts/pr_risk_classifier.py \
            --repo ${{ github.repository }} \
            --pr ${{ github.event.pull_request.number }} \
            --token ${{ secrets.GITHUB_TOKEN }}

      - name: Run PR-Agent review
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTION_AUTO_REVIEW: "true"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            Focus on:
            1. Backdoor-like patterns (eval, exec, subprocess shell, obfuscation).
            2. Licence compliance: no GPL-3.0 licence changes, no proprietary deps.
            3. Alignment with the project goal: interactive embroidery simulator.
            4. Presence of tests for new functionality.
            5. No changes to .github/, LICENSE, pyproject.toml identity fields,
               or core entrypoints unless explicitly approved by @oorteo.

      - name: Add low-risk automerge label
        if: steps.classify.outputs.risk == 'low'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --add-label "automerge"

  auto-merge:
    name: Auto-merge low-risk PRs
    runs-on: ubuntu-latest
    needs: ai-review
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.pull_requests.*.labels.*.name, 'automerge')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.workflow_run.pull_requests[0].number }} \
            --repo ${{ github.repository }} \
            --approve --body "Approved by AI co-maintainer (low-risk PR)."

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.workflow_run.pull_requests[0].number }} \
            --repo ${{ github.repository }} \
            --squash --auto --delete-branch
