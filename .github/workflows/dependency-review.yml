name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # InkSim is GPL-3.0-or-later.  Allow broadly compatible open-source
          # licenses in dependencies.  Proprietary or copyleft-incompatible
          # licenses block the PR.
          # Comma-separated SPDX license identifiers.  The project itself is
          # GPL-3.0-or-later; allow broadly compatible open-source licenses.
          allow-licenses: GPL-3.0-only, GPL-3.0-or-later, LGPL-3.0-only, LGPL-3.0-or-later, MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, Python-2.0
