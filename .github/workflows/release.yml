name: Release wheel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libxkbcommon0 libdbus-1-3 libfontconfig1 xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run tests
        run: xvfb-run -a uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build distributions
        run: uv build

      # Tags containing a hyphen mark a pre-release (e.g. v0.5.4-rc.1). Plain
      # version tags (e.g. v0.5.4) stay published releases and get the
      # repository's "latest" label assigned by semantic version order.
      - name: Create GitHub release with wheel
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
