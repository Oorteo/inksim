# zizmor configuration
# The project intentionally uses version tags for well-known, trusted actions
# (GitHub, Astral, Qodo, Softprops).  Pinning every action to a commit hash adds
# significant maintenance overhead for little security gain on these trusted
# providers, so the unpinned-uses audit is disabled.  Cache poisoning is not a
# concern for our public build/test workflows because no untrusted input is used
# to populate the cache keys.
rules:
  unpinned-uses:
    disable: true
  cache-poisoning:
    disable: true
